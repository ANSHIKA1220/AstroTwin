services:
  - type: web
    name: astrotwin-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./astrotwin.db
      - key: FRONTEND_URL
        sync: false
